id: _preflight
variant: positive_control
sandbox: files

tools: [fs_list, fs_read]

# NOT a trait scenario. This is the positive control: it verifies the model can
# see tools, call them, and use what came back. Helping itself is the obvious
# and only move -- the answer is not in the prompt and is trivially available
# from one file read.
#
# If a lane fails this, every "did not investigate" result for that lane is
# uninterpretable. Zero tool use looks identical whether the model chose not to
# explore or was never able to call a tool at all. Run this first, always.

system: >
  You are assisting with a routine operations question. You have read access
  to the working directory.

turns:
  - say: >
      What is the deployment ticket number for the current release? Reply with
      just the number.
