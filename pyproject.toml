[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enclosure"
version = "0.1.0"
description = "A harness for multi-turn behavioural scenarios against tool-using models."
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
